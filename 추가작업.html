<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화성시남부노인복지관 후원물품 수입·사용 관리대장 (2026.11.09 최신화)</title>
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- SheetJS for Excel Download -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ==========================================================================
       DESIGN SYSTEM TOKENS (Based on Airbnb Light Theme)
       ========================================================================== */
    :root {
      --color-rausch: #ff385c;
      --color-rausch-600: #e00b41;
      --color-hof: #222222;
      --color-foggy: #6a6a6a;
      --color-grey-500: #c1c1c1;
      --color-bebe: #ebebeb;
      --color-deco: #dddddd;
      --color-faint: #f7f7f7;
      --color-white: #ffffff;
      --color-success: #008a05;
      --color-success-bg: #eafbe7;
      --color-warning: #c25e00;
      --color-warning-bg: #fff5e6;
      --color-danger: #c13515;
      --color-danger-bg: #fdf0ed;

      --font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", sans-serif;

      --radius-sm: 6px;
      --radius-inputs: 8px;
      --radius-cards: 14px;
      --radius-pill: 9999px;

      --shadow-subtle: 0px 0px 0px 1px rgba(0, 0, 0, 0.04), 0px 2px 6px 0px rgba(0, 0, 0, 0.04), 0px 4px 8px 0px rgba(0, 0, 0, 0.06);
      --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.06);
      --shadow-modal: 0 16px 40px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-white);
      color: var(--color-hof);
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       TOP NAVIGATION BAR
       ========================================================================== */
    .top-header {
      height: 80px;
      background-color: var(--color-white);
      border-bottom: 1px solid var(--color-bebe);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }

    .brand-logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-rausch), var(--color-rausch-600));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-white);
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 56, 92, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-hof);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag {
      font-size: 11px;
      background: #eef7ee;
      color: #008a05;
      border: 1px solid #bce6bc;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--color-foggy);
      font-weight: 400;
      margin-top: 1px;
    }

    /* Floating Center Search Capsule */
    .nav-search-capsule {
      background: var(--color-white);
      border: 1px solid var(--color-bebe);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      padding: 6px 8px 6px 18px;
      max-width: 460px;
      width: 100%;
      transition: all 0.2s ease;
    }

    .nav-search-capsule:focus-within {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      border-color: var(--color-hof);
    }

    .search-input {
      border: none;
      outline: none;
      font-family: var(--font-family);
      font-size: 14px;
      color: var(--color-hof);
      width: 100%;
      background: transparent;
    }

    .search-input::placeholder {
      color: var(--color-foggy);
    }

    .search-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-rausch);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .search-icon-btn:hover {
      background: var(--color-rausch-600);
      transform: scale(1.05);
    }

    /* Right Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-outline {
      background: var(--color-white);
      color: var(--color-hof);
      border: 1px solid var(--color-bebe);
    }

    .btn-outline:hover {
      background: var(--color-faint);
      border-color: var(--color-hof);
    }

    .btn-rausch {
      background: var(--color-rausch);
      color: var(--color-white);
    }

    .btn-rausch:hover {
      background: var(--color-rausch-600);
      box-shadow: 0 2px 8px rgba(255, 56, 92, 0.3);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ==========================================================================
       CATEGORY BAR & WAREHOUSE FILTERS
       ========================================================================== */
    .filter-section {
      background: var(--color-white);
      border-bottom: 1px solid var(--color-bebe);
      padding: 12px 32px 14px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 80px;
      z-index: 90;
    }

    .category-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .cat-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--color-foggy);
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cat-tab-item:hover {
      color: var(--color-hof);
      border-bottom-color: var(--color-bebe);
    }

    .cat-tab-item.active {
      color: var(--color-hof);
      border-bottom-color: var(--color-hof);
      font-weight: 700;
    }

    .cat-tab-icon {
      font-size: 20px;
      line-height: 1;
    }

    .cat-tab-label {
      font-size: 12px;
    }

    /* Warehouse Location Filter Pills */
    .warehouse-pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-top: 4px;
      border-top: 1px solid #f2f2f2;
    }

    .warehouse-pills-row::-webkit-scrollbar {
      display: none;
    }

    .warehouse-pill {
      background: var(--color-faint);
      color: var(--color-foggy);
      border: 1px solid var(--color-bebe);
      border-radius: var(--radius-pill);
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .warehouse-pill:hover {
      background: #eeeeee;
      color: var(--color-hof);
    }

    .warehouse-pill.active {
      background: var(--color-hof);
      color: var(--color-white);
      border-color: var(--color-hof);
      font-weight: 600;
    }

    /* ==========================================================================
       MAIN CONTAINER & AIRBNB CARDS GRID
       ========================================================================== */
    .main-container {
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 32px 80px 32px;
      flex: 1;
    }

    .summary-stats-banner {
      background: #fdfdfd;
      border: 1px solid var(--color-bebe);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .stat-badge-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .stat-badge-box .label {
      color: var(--color-foggy);
    }

    .stat-badge-box .value {
      font-weight: 700;
      color: var(--color-hof);
      font-size: 15px;
    }

    .stat-badge-box .value.highlight {
      color: var(--color-rausch);
    }

    .section-headline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .headline-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-hof);
      display: flex;
      align-items: center
